services:
  - type: web
    name: creditstrike-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prototype
